<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-label="Gold glass analytics dashboard illustration">
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".88"/><stop offset=".55" stop-color="#fff8e9" stop-opacity=".35"/><stop offset="1" stop-color="#e5ae45" stop-opacity=".15"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#fce9b8"/><stop offset=".42" stop-color="#efb944"/><stop offset="1" stop-color="#d78e12"/></linearGradient>
 <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff2c9"/><stop offset=".55" stop-color="#f6c75c"/><stop offset="1" stop-color="#e69a1c"/></linearGradient>
 <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff7e5" stop-opacity=".1"/><stop offset="1" stop-color="#e6ad45" stop-opacity=".26"/></linearGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
